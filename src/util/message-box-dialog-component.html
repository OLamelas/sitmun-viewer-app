<h2 mat-dialog-title>{{title}}</h2>
<mat-dialog-content>
  <div [innerHTML]="message"></div>
</mat-dialog-content>
<mat-dialog-actions>
  @if (type === types.CONFIRM) {
  <button mat-button class="sitmun-message-box-cancel" [mat-dialog-close]="false">
    <mat-icon>undo</mat-icon>
    {{cancelLabel}}
  </button>
  <button mat-button [color]="destructive ? 'warn' : undefined" [mat-dialog-close]="true">{{confirmLabel}}</button>
  } @if (type === types.ALERT) {
  <button mat-button [mat-dialog-close]="true">Cerrar</button>
  }
</mat-dialog-actions>
